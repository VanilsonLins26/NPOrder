<!-- ======================================================
     RESULTADO DO PAGAMENTO — Animação Premium
     ====================================================== -->
<div class="result-page" [ngClass]="'result-page--' + type">

  <!-- Confetti (sucesso) -->
  <ng-container *ngIf="type === 'success'">
    <div class="confetti-piece confetti-piece--1"></div>
    <div class="confetti-piece confetti-piece--2"></div>
    <div class="confetti-piece confetti-piece--3"></div>
    <div class="confetti-piece confetti-piece--4"></div>
    <div class="confetti-piece confetti-piece--5"></div>
    <div class="confetti-piece confetti-piece--6"></div>
    <div class="confetti-piece confetti-piece--7"></div>
    <div class="confetti-piece confetti-piece--8"></div>
  </ng-container>

  <!-- Card -->
  <div class="result-card animate-scaleIn" [id]="'result-card-' + type">

    <!-- Icon circle -->
    <div class="result-icon" [ngClass]="'result-icon--' + type">
      <div class="result-icon__ring"></div>
      <i [class]="'pi ' + icon"></i>
    </div>

    <!-- Title -->
    <h1 class="result-title" [ngClass]="'result-title--' + type">{{ title }}</h1>

    <!-- Message -->
    <p class="result-message">{{ message }}</p>

    <!-- Payment ID badge (quando houver) -->
    <div *ngIf="paymentId" class="result-payment-id">
      <i class="pi pi-hashtag"></i>
      <span>Ref: <strong>{{ paymentId }}</strong></span>
    </div>

    <!-- CTA -->
    <button class="result-cta" [ngClass]="'result-cta--' + type"
            (click)="goToOrders()"
            id="btn-ver-pedidos">
      <i class="pi pi-list"></i>
      Ver Meus Pedidos
    </button>

    <!-- Secondary action (falha) -->
    <a *ngIf="type === 'failure'" routerLink="/cardapio" class="result-secondary" id="link-voltar-cardapio-resultado">
      <i class="pi pi-arrow-left"></i>
      Voltar ao cardápio
    </a>

  </div>
</div>
